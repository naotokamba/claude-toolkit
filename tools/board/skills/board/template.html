<title>__BOARD_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* ボード: 先頭に目的・ゴール・直近の報告、その下に判断待ち、全体図、カード、決定事項、閉じたカードの順。データはアーティファクトのデータベースから読む。 */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #1b2330;
  --muted: #5d6778;
  --line: #d6dce5;
  --accent: #2b59c3;
  --do: #2b59c3; --do-soft: #e4ebfa;
  --wait: #9a5b00; --wait-soft: #fdf0dc;
  --done: #1f7a4d; --done-soft: #e2f3e9;
  --bad: #b3261e; --bad-soft: #fde7e5;
  --chip: #eceff3; --track: #e7ebf0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --surface: #1b212b; --ink: #e6eaf1; --muted: #9aa4b5; --line: #2d3542; --accent: #8fb0ff;
  --do: #8fb0ff; --do-soft: #22304d; --wait: #f0b45a; --wait-soft: #3a2c16; --done: #6fd3a0; --done-soft: #173527;
  --bad: #ff8a80; --bad-soft: #3d1d1b; --chip: #262d38; --track: #2a313c; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1b212b; --ink: #e6eaf1; --muted: #9aa4b5; --line: #2d3542; --accent: #8fb0ff;
  --do: #8fb0ff; --do-soft: #22304d; --wait: #f0b45a; --wait-soft: #3a2c16; --done: #6fd3a0; --done-soft: #173527;
  --bad: #ff8a80; --bad-soft: #3d1d1b; --chip: #262d38; --track: #2a313c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); line-height: 1.6; overflow-wrap: anywhere; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 22px; margin: 0 0 6px; }
h2 { font-size: 16px; margin: 28px 0 10px; display: flex; gap: 8px; align-items: baseline; }
h2 .n { color: var(--muted); font-weight: normal; font-size: 13px; }
.head { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.row { display: flex; gap: 10px; align-items: baseline; margin-top: 6px; }
.row .k { flex: none; width: 5.5em; color: var(--muted); font-size: 12px; }
.row > :last-child, summary > span, .tile > div { min-width: 0; }
.meta { color: var(--muted); font-size: 12px; margin-top: 10px; }
.badge { display: inline-block; flex: none; font-size: 11px; font-weight: bold; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.b-do { background: var(--do-soft); color: var(--do); }
.b-wait { background: var(--wait-soft); color: var(--wait); }
.b-done { background: var(--done-soft); color: var(--done); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-plain { background: var(--chip); color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.wait-item { border-bottom: 1px solid var(--line); }
.wait-item:last-child { border-bottom: 0; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.wait-item > details > summary, .closed > summary { padding: 12px 16px; display: flex; gap: 8px; align-items: baseline; }
.wait-item > details > summary::before, .task details > summary::before, .closed > summary::before { content: "▸"; color: var(--muted); flex: none; }
.wait-item > details[open] > summary::before, .task details[open] > summary::before, .closed[open] > summary::before { content: "▾"; }
.from { color: var(--muted); font-size: 12px; flex: none; }
.ronten { padding: 4px 16px 14px 34px; }
.ronten .row .k { width: 7em; }
.ronten ul { margin: 0; padding-left: 1.2em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tile { display: block; color: inherit; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile:hover { border-color: var(--accent); }
.tile .t { font-weight: bold; }
.tile .g { color: var(--muted); font-size: 12px; margin-top: 2px; }
.bar { height: 6px; background: var(--track); border-radius: 3px; margin-top: 8px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.counts { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; }
.cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
.card { padding: 14px 16px; scroll-margin-top: 12px; }
.card .t { font-weight: bold; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card .g { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.task { padding: 6px 0; border-top: 1px dashed var(--line); }
.task .line { display: flex; gap: 8px; align-items: baseline; }
.task .txt { flex: 1; min-width: 0; }
.task.k-done .txt { color: var(--muted); }
.task details > summary { display: flex; gap: 8px; align-items: baseline; }
.task .ronten { padding: 6px 0 2px 18px; }
.owner { font-size: 11px; color: var(--muted); flex: none; }
a.ilink { font-size: 12px; color: var(--accent); flex: none; }
.decisions li { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
.decisions li:last-child { border-bottom: 0; }
.date { color: var(--muted); font-size: 12px; flex: none; }
.closed { margin-top: 28px; }
.closed-list li { padding: 8px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.over { outline: 2px dashed var(--bad); outline-offset: 2px; }
.over-tag { color: var(--bad); font-size: 11px; font-weight: bold; margin-left: 6px; }
.notice { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 12px 16px; margin-top: 12px; }
.empty { color: var(--muted); padding: 12px 16px; }
@media (max-width: 640px) {
  .row { flex-direction: column; gap: 0; }
  .row .k { width: auto; }
  .ronten .row .k { width: auto; }
}
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  // format.md と同じ上限。超えたものは赤い破線で囲んで見せる
  var LIMIT = { title: 40, purpose: 80, goal: 80, report: 80, decision: 80, cardTitle: 30, cardGoal: 80, task: 60, question: 80, material: 80, recommend: 120, shaken: 80, ifDo: 80, ifDont: 80, notFound: 80 };
  var ACTIVE = "進行中";
  var KIND_CLASS = { "やるだけ": "b-do", "判断待ち": "b-wait", "済み": "b-done" };
  var STATE_CLASS = { "進行中": "b-do", "issueに移した": "b-done", "別途やる": "b-plain", "済み": "b-done" };
  var state = { board: null, cards: [], loaded: { board: false, cards: false }, error: null };
  var app = document.getElementById("app");

  function el(tag, cls, kids) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    (kids || []).forEach(function (k) {
      if (k === null || k === undefined || k === false) return;
      n.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
    });
    return n;
  }
  function text(tag, cls, s, limit) {
    var str = typeof s === "string" ? s : "";
    var n = el(tag, cls, [str]);
    if (limit && str.length > limit) {
      n.classList.add("over");
      n.appendChild(el("span", "over-tag", ["長すぎる " + str.length + "/" + limit]));
    }
    return n;
  }
  function badge(label, cls) { return el("span", "badge " + (cls || "b-plain"), [label]); }
  function link(obj) {
    if (!obj || typeof obj.url !== "string" || !/^https:\/\//.test(obj.url)) return null;
    var a = el("a", "ilink", [obj.label || obj.url]);
    a.href = obj.url; a.target = "_blank"; a.rel = "noopener";
    return a;
  }
  function row(k, v) { return v ? el("div", "row", [el("span", "k", [k]), v]) : null; }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function tasksOf(c) { return arr(c.tasks).filter(function (t) { return t && typeof t === "object"; }); }

  function rontenView(r) {
    if (!r || typeof r !== "object") return el("div", "ronten", [el("div", "row", ["論点がまだ書かれていません"])]);
    var mats = arr(r.materials).length ? el("ul", null, arr(r.materials).map(function (m) { return text("li", null, m, LIMIT.material); })) : null;
    var nf = arr(r.notFound).length ? el("ul", null, arr(r.notFound).map(function (m) { return text("li", null, m, LIMIT.notFound); })) : null;
    return el("div", "ronten", [
      row("材料", mats),
      row("推奨", r.recommend ? text("span", null, r.recommend, LIMIT.recommend) : null),
      row("揺らいだ決定事項", r.shaken ? text("span", null, r.shaken, LIMIT.shaken) : null),
      row("こうならやる", r.ifDo ? text("span", null, r.ifDo, LIMIT.ifDo) : null),
      row("こうならやらない", r.ifDont ? text("span", null, r.ifDont, LIMIT.ifDont) : null),
      row("見つからなかった", nf)
    ]);
  }

  function counts(c) {
    var n = { "やるだけ": 0, "判断待ち": 0, "済み": 0 };
    tasksOf(c).forEach(function (t) { if (n[t.kind] !== undefined) n[t.kind]++; });
    return n;
  }

  function header(b) {
    var rep = b.report && typeof b.report === "object" ? b.report : null;
    var repLine = rep ? el("span", null, [badge(rep.result || "?", rep.result === "完遂した" ? "b-done" : "b-bad"), " ", text("span", null, rep.text, LIMIT.report)]) : null;
    return el("section", "head", [
      text("h1", null, b.title || "ボード", LIMIT.title),
      row("目的", b.purpose ? text("span", null, b.purpose, LIMIT.purpose) : null),
      row("ゴール", b.goal ? text("span", null, b.goal, LIMIT.goal) : null),
      row("直近の報告", repLine),
      b.updated ? el("div", "meta", ["最終更新 " + b.updated]) : null
    ]);
  }

  function waitingSection(active) {
    var items = [];
    active.forEach(function (c) {
      tasksOf(c).forEach(function (t) {
        if (t.kind !== "判断待ち") return;
        var q = t.ronten && t.ronten.question ? t.ronten.question : t.text;
        items.push(el("li", "wait-item", [el("details", null, [
          el("summary", null, [badge("判断待ち", "b-wait"), text("span", null, q, LIMIT.question), el("span", "from", [c.title || ""])]),
          el("div", "ronten", [row("作業", text("span", null, t.text, LIMIT.task))]),
          rontenView(t.ronten)
        ])]));
      });
    });
    return [
      el("h2", null, ["判断待ち", el("span", "n", [items.length + " 件"])]),
      items.length ? el("ul", "list panel", items) : el("div", "panel empty", ["判断待ちはありません"])
    ];
  }

  function overview(active) {
    var tiles = active.map(function (c) {
      var n = counts(c), total = n["やるだけ"] + n["判断待ち"] + n["済み"];
      var pct = function (x) { return total ? (x / total * 100) + "%" : "0"; };
      var bar = el("div", "bar", [
        (function () { var s = el("span"); s.style.width = pct(n["済み"]); s.style.background = "var(--done)"; return s; })(),
        (function () { var s = el("span"); s.style.width = pct(n["判断待ち"]); s.style.background = "var(--wait)"; return s; })(),
        (function () { var s = el("span"); s.style.width = pct(n["やるだけ"]); s.style.background = "var(--do)"; s.style.opacity = ".35"; return s; })()
      ]);
      var a = el("a", "tile", [
        text("div", "t", c.title, LIMIT.cardTitle),
        text("div", "g", c.goal, LIMIT.cardGoal),
        bar,
        el("div", "counts", [el("span", null, ["済み " + n["済み"]]), el("span", null, ["判断待ち " + n["判断待ち"]]), el("span", null, ["やるだけ " + n["やるだけ"]])])
      ]);
      a.href = "#card-" + encodeURIComponent(c.id);
      return a;
    });
    return [el("h2", null, ["全体図", el("span", "n", [active.length + " 枚"])]), tiles.length ? el("div", "grid", tiles) : el("div", "panel empty", ["進行中のカードはありません"])];
  }

  function taskView(t) {
    var kindCls = KIND_CLASS[t.kind] || "b-bad";
    var bits = [badge(t.kind || "種類なし", kindCls), text("span", "txt", t.text, LIMIT.task), t.owner ? el("span", "owner", [t.owner]) : null, link(t.issue)];
    var li = el("li", "task " + (t.kind === "済み" ? "k-done" : ""));
    if (t.kind === "判断待ち") {
      li.appendChild(el("details", null, [el("summary", null, bits), rontenView(t.ronten)]));
    } else {
      li.appendChild(el("div", "line", bits));
    }
    return li;
  }

  function cardView(c) {
    var order = { "判断待ち": 0, "やるだけ": 1, "済み": 2 };
    var ts = tasksOf(c).slice().sort(function (a, b) { return (order[a.kind] === undefined ? 3 : order[a.kind]) - (order[b.kind] === undefined ? 3 : order[b.kind]); });
    var node = el("article", "panel card", [
      el("div", "t", [text("span", null, c.title, LIMIT.cardTitle), link(c.issue)]),
      c.goal ? el("div", "g", ["ゴール: ", text("span", null, c.goal, LIMIT.cardGoal)]) : el("div", "g", ["ゴールがまだ書かれていません"]),
      ts.length ? el("ul", "list", ts.map(taskView)) : el("div", "empty", ["作業はまだありません"])
    ]);
    node.id = "card-" + encodeURIComponent(c.id);
    return node;
  }

  function decisionsSection(b) {
    var ds = arr(b.decisions).filter(function (d) { return d && typeof d === "object"; });
    return [
      el("h2", null, ["決定事項", el("span", "n", [ds.length + " 件"])]),
      ds.length ? el("ul", "list panel decisions", ds.map(function (d) { return el("li", null, [text("span", null, d.text, LIMIT.decision), d.date ? el("span", "date", [d.date]) : null]); })) : el("div", "panel empty", ["決定事項はまだありません"])
    ];
  }

  function closedSection(closed) {
    if (!closed.length) return [];
    return [el("details", "panel closed", [
      el("summary", null, ["閉じたカード", el("span", "from", [closed.length + " 枚"])]),
      el("ul", "list closed-list", closed.map(function (c) { return el("li", null, [badge(c.state, STATE_CLASS[c.state] || "b-plain"), text("span", null, c.title, LIMIT.cardTitle), link(c.issue)]); }))
    ])];
  }

  function render() {
    app.textContent = "";
    if (state.error) app.appendChild(el("div", "notice", [state.error]));
    if (!state.loaded.board || !state.loaded.cards) {
      if (!state.error) app.appendChild(el("div", "empty", ["読み込んでいます…"]));
      return;
    }
    var b = state.board || {};
    var cards = state.cards.slice().sort(function (x, y) { return (Number(x.order) || 0) - (Number(y.order) || 0); });
    var active = cards.filter(function (c) { return c.state === ACTIVE || !c.state; });
    var closed = cards.filter(function (c) { return c.state && c.state !== ACTIVE; });
    [header(b)].concat(waitingSection(active), overview(active),
      [el("h2", null, ["カード", el("span", "n", [active.length + " 枚"])]), active.length ? el("div", "cards", active.map(cardView)) : el("div", "panel empty", ["進行中のカードはありません"])],
      decisionsSection(b), closedSection(closed)
    ).forEach(function (n) { if (n) app.appendChild(n); });
  }

  function onErr(e) {
    var code = e && e.code ? e.code : "unavailable";
    state.error = code === "revoked" ? "この表示では、もう共有データを読めません。" : "共有データを読めませんでした（" + code + "）。開き直すと読み直します。";
    render();
  }
  function toList(snap) {
    return snap.docs.filter(function (d) { return d.exists; }).map(function (d) {
      var o = Object.assign({}, d.data() || {});
      o.id = d.id;
      return o;
    });
  }

  async function start() {
    render();
    var db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) {
      state.error = "この表示では共有データを読めません。claude.ai にサインインして開くと、中身が出ます。";
      render();
      return;
    }
    db.doc("meta/board").onSnapshot(function (snap) { state.board = snap.exists ? snap.data() : null; state.loaded.board = true; render(); }, onErr);
    db.collection("cards").onSnapshot(function (snap) { state.cards = toList(snap); state.loaded.cards = true; render(); }, onErr);
  }

  start();
})();
</script>
